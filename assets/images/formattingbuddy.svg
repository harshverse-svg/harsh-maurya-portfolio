  <line x1="266" y1="296" x2="308" y2="296" stroke="#4F5BD5" stroke-width="4"/>
  <!-- Node C -->
  <circle cx="322" cy="296" r="14" fill="#0D9488"/>
  
  <!-- Lower Text Lines -->
  <rect x="150" y="366" width="200" height="10" rx="5" fill="#5B6780"/>
  <rect x="150" y="388" width="130" height="10" rx="5" fill="#8E9AB8"/>
  
  <!-- AI Sparkle Star (Top Right of Document) -->
  <path d="M410 70 C410 95 425 110 450 110 C425 110 410 125 410 150 C410 125 395 110 370 110 C395 110 410 95 410 70 Z" fill="#FBBF24"/>
  <circle cx="454" cy="66" r="6" fill="#FBBF24"/>
