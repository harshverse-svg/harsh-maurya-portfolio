<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F5BD5"/>
      <stop offset="100%" stop-color="#3D46B0"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F8FD"/>
      <stop offset="100%" stop-color="#EAF0FA"/>
    </linearGradient>
  </defs>
  
  <!-- Outer App Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Document Sheet -->
  <rect x="110" y="80" width="292" height="352" rx="24" fill="url(#docGrad)" stroke="#D3DCEC" stroke-width="4"/>
  
  <!-- Fold Corner -->
  <path d="M322 80 L402 160 L346 160 C333 160 322 149 322 136 Z" fill="#D3DCEC"/>
  
  <!-- Document Title Bar -->
  <rect x="150" y="146" width="130" height="18" rx="9" fill="#4F5BD5"/>
  <rect x="150" y="184" width="190" height="10" rx="5" fill="#5B6780"/>
  <rect x="150" y="206" width="160" height="10" rx="5" fill="#8E9AB8"/>
  
  <!-- Mini Diagram Nodes (Hierarchical Workflow) -->
  <rect x="150" y="248" width="212" height="96" rx="14" fill="#EAF0FA" stroke="#D3DCEC" stroke-width="2"/>
  
  <!-- Node A -->
  <circle cx="186" cy="296" r="14" fill="#4F5BD5"/>
  <!-- Connecting line -->
  <line x1="200" y1="296" x2="242" y2="296" stroke="#4F5BD5" stroke-width="4" stroke-dasharray="4 2"/>
